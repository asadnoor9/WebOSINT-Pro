name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Ruff is pinned EXACTLY, and must match the `dev` extra in
      # pyproject.toml and requirements-dev.txt. Ruff adds and removes rules
      # between releases: 0.6.x enforced UP038, which later releases removed
      # because `isinstance(x, A | B)` is slower than the tuple form. A range
      # specifier here means CI lints with a different rule set than
      # contributors do, which fails the pipeline on unchanged code.
      - name: Install Ruff
        run: python -m pip install "ruff==0.15.12"

      - name: Report the Ruff version
        run: ruff --version

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # A wheel that fails metadata validation cannot be published, so catch
      # it here rather than during a release.
      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Verify the console script installs and runs
        run: |
          python -m pip install dist/*.whl
          webosint version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  hygiene:
    name: Secret and artifact hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generated scan output must never be committed: it contains third-party
      # hostnames, addresses and evidence.
      - name: Reject committed scan artifacts
        run: |
          if git ls-files | grep -E '^(output|logs|reports)/.*\.(json|html|md|csv|pdf|docx|jsonl|log)$'; then
            echo "::error::Generated scan artifacts are committed. They belong in output/, which is git-ignored."
            exit 1
          fi
          echo "No committed scan artifacts."

      - name: Reject a committed local config
        run: |
          if git ls-files --error-unmatch config.json 2>/dev/null; then
            echo "::error::config.json is tracked. Commit config.example.json instead."
            exit 1
          fi
          echo "Only config.example.json is tracked."

      - name: Scan for credential patterns
        run: |
          if git ls-files -z | xargs -0 grep -nIE \
            'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJhbGciOi[A-Za-z0-9_-]{10,}' \
            -- ':!*.lock' ':!.github/workflows/*'; then
            echo "::error::Possible credential committed."
            exit 1
          fi
          echo "No credential patterns found."

  # A single required status check for branch protection, so the rule does not
  # need editing every time the matrix changes.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [lint, test, build, hygiene]
    if: always()
    steps:
      - name: Verify that every job succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.hygiene.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
