[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webosint-pro"
version = "3.0.0"
description = "Authorized Web OSINT, reconnaissance, and attack surface management framework"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.0.0",
  "aiohttp>=3.9.0",
  "aiodns>=3.2.0",
  "dnspython>=2.4.2",
  "python-whois>=0.8.0",
  "pyOpenSSL>=23.3.0",
  "cryptography>=41.0.0",
  "tabulate>=0.9.0",
  "colorama>=0.4.6",
  "rich>=13.7.0",
  "textual>=0.58.0",
  "PyYAML>=6.0.1",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "Jinja2>=3.1.2",
]

[project.scripts]
webosint = "engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.5.0", "pre-commit>=3.7.0"]
integrations = ["shodan>=1.28.0", "mmh3>=4.0.0", "pymongo>=4.6.0"]
web = ["Flask>=3.0.0,<4.0"]
reports = ["python-docx>=1.1.0,<2.0", "reportlab>=4.1.0,<6.0", "openpyxl>=3.1.0,<4.0"]
service = ["psutil>=5.9.0"]
validation = ["pydantic>=2.6.0,<3.0"]
all = [
  "python-docx>=1.1.0,<2.0",
  "reportlab>=4.1.0,<6.0",
  "openpyxl>=3.1.0,<4.0",
  "psutil>=5.9.0",
  "pydantic>=2.6.0,<3.0",
  "Flask>=3.0.0,<4.0",
]

[tool.setuptools.packages.find]
include = [
  "ai*",
  "core*",
  "engine*",
  "database*",
  "integrations*",
  "modules*",
  "privacy*",
  "reports*",
  "reporting*",
  "utils*",
  "web*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
