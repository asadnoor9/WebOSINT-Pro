[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webosint-pro"
version = "2.0.0"
description = "Passive-first Web OSINT, reconnaissance and attack surface management framework for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asad Noor", email = "noreply@users.noreply.github.com" }]
maintainers = [{ name = "Asad Noor", email = "noreply@users.noreply.github.com" }]
keywords = [
  "osint",
  "reconnaissance",
  "attack-surface-management",
  "security",
  "dns",
  "whois",
  "subdomain-enumeration",
  "fingerprinting",
  "blue-team",
  "red-team",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking :: Monitoring",
  "Typing :: Typed",
]

# Runtime dependencies. Kept deliberately small: anything only one optional
# feature needs lives in an extra so a default install stays lean and audits
# quickly.
dependencies = [
  "requests>=2.32.0,<3.0",
  "urllib3>=2.2.0,<3.0",
  "dnspython>=2.6.1,<3.0",
  "beautifulsoup4>=4.12.0,<5.0",
  "lxml>=5.2.0,<6.0",
  "python-whois>=0.9.4,<1.0",
  "cryptography>=42.0.0,<46.0",
  "PyYAML>=6.0.1,<7.0",
  "python-dotenv>=1.0.1,<2.0",
]

[project.optional-dependencies]
# Word, PDF and Excel exporters.
reports = [
  "python-docx>=1.1.0,<2.0",
  "reportlab>=4.1.0,<5.0",
  "openpyxl>=3.1.0,<4.0",
]
# Local web dashboard (webserve.py).
web = ["Flask>=3.0.0,<4.0"]
# Third-party enrichment sources.
integrations = [
  "shodan>=1.28.0,<2.0",
  "mmh3>=4.0.0,<6.0",
]
# Result persistence and history.
database = [
  "SQLAlchemy>=2.0.0,<3.0",
  "alembic>=1.13.0,<2.0",
]
# Background service and process metrics.
service = ["psutil>=5.9.0,<8.0"]
# Strict config and API schema validation.
validation = ["pydantic>=2.6.0,<3.0"]
# Everything a user could want at runtime, with no dev tooling.
all = [
  "webosint-pro[reports,web,integrations,database,service,validation]",
]
# Contributor tooling.
dev = [
  "ruff==0.15.12",
  "pytest>=8.2.0,<9.0",
  "pytest-cov>=5.0.0,<7.0",
  "pre-commit>=3.7.0,<5.0",
  "build>=1.2.0,<2.0",
  "twine>=5.1.0,<7.0",
]

[project.scripts]
webosint = "engine.cli:main"

[project.urls]
Homepage = "https://github.com/asadnoor9/WebOSINT-Pro"
Repository = "https://github.com/asadnoor9/WebOSINT-Pro"
Documentation = "https://github.com/asadnoor9/WebOSINT-Pro/tree/main/docs"
Changelog = "https://github.com/asadnoor9/WebOSINT-Pro/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/asadnoor9/WebOSINT-Pro/issues"
"Security Policy" = "https://github.com/asadnoor9/WebOSINT-Pro/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
include = [
  "ai*",
  "core*",
  "database*",
  "engine*",
  "integrations*",
  "modules*",
  "privacy*",
  "reporting*",
  "utils*",
  "web*",
]
exclude = ["tests*", "output*", "scripts*", "docs*"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = [
  "core",
  "engine",
  "modules",
  "reporting",
  "privacy",
  "utils",
  "web",
]
omit = ["tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["output", "venv", ".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # function calls in argument defaults are used deliberately
  "SIM105", # contextlib.suppress hurts readability in hot paths
  # Scanner modules declare their metadata (name, requires, categories) as
  # class-level dicts and lists that are read but never mutated. Annotating
  # every one as ClassVar is tracked as a follow-up; see CONTRIBUTING.md.
  "RUF012",
  # Long-lived handles are deliberate: the daemon holds its log file open for
  # the process lifetime, and several tests open files to assert on handles.
  "SIM115",
  # Nested `with` around socket + SSL wrapping keeps the teardown order
  # explicit; collapsing them obscures which context fails.
  "SIM117",
  # Report templates intentionally use typographic dashes.
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["core", "engine", "reporting"]
